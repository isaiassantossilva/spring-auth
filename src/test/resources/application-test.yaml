spring:
  datasource:
    url: jdbc:h2:mem:springauth-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

app:
  bootstrap:
    admin-username: admin
    admin-password: admin
    admin-email: admin@example.com
  security:
    jwt:
      secret: test-secret-please-change-me-32bytes-minimum-required
      ttl-minutes: 60
      issuer: spring-auth-test

logging:
  level:
    com.santos.spring_auth: WARN
    org.springframework.security: WARN
